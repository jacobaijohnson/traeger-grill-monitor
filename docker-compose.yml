# ─── Traeger Smoker Insight — Docker Compose (LSIO) ────
# DSS Classification: DSS-1 (Public / Non-Sensitive)
#
# Usage:
#   1. Copy ENV_TEMPLATE.md values into a .env file
#   2. docker compose up -d
#   3. Access at http://localhost:3000
#
# For MySQL/TiDB, either:
#   a. Use the bundled MySQL service (default)
#   b. Set DATABASE_URL to an external database and remove the mysql service

services:
  traeger:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traeger-smoker-insight
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # ─── LSIO Standard ───
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Los_Angeles}
      # ─── App Config ───
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-mysql://traeger:traeger_pass@mysql:3306/traeger_dashboard}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    volumes:
      - ${CONFIG_PATH:-./config}:/config
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: traeger-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: traeger_dashboard
      MYSQL_USER: traeger
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-traeger_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
