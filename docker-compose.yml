# ─── Traeger Grill Monitor — Docker Compose ─────────────
#
# Default port: 8420 (IANA unassigned, no homelab conflicts)
#
# Quick start:
#   1. Copy this file and adjust environment variables
#   2. docker compose up -d
#   3. Access at http://<your-host>:8420
#   4. First user to register becomes the admin (via ADMIN_EMAIL/ADMIN_PASSWORD)
#
# For external MySQL/MariaDB:
#   Set DATABASE_URL and remove the mysql service below.

services:
  traeger:
    image: ghcr.io/jacobaijohnson/traeger-grill-monitor:latest
    # Or build locally:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: traeger-grill-monitor
    ports:
      - "8420:8420"
    environment:
      # ─── LSIO Standard ─────────────────────────────
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Los_Angeles}
      # ─── App Config ────────────────────────────────
      - NODE_ENV=production
      - PORT=8420
      - DATABASE_URL=mysql://traeger:${MYSQL_PASSWORD:-traeger_pass}@mysql:3306/traeger_dashboard
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET to a random 64-char string}
      # ─── Better Auth ───────────────────────────────
      # Set this to your external URL if behind a reverse proxy
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:8420}
      # ─── Admin Bootstrap ───────────────────────────
      # On first boot, creates an admin user with these credentials.
      # Remove after first login if desired.
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - ${CONFIG_PATH:-./config}:/config
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: traeger-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: traeger_dashboard
      MYSQL_USER: traeger
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-traeger_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
