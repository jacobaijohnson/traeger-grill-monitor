# Promtail configuration for Traeger Grill Monitor
# Collects Docker container logs and ships to Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Keep only traeger-related containers
      - source_labels: ['__meta_docker_container_name']
        regex: '/(traeger-.*|traeger-mysql)'
        action: keep
      # Use container name as label
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container_name
      # Add compose service label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
    pipeline_stages:
      # Parse JSON logs from traeger app (pino format)
      - match:
          selector: '{container_name="traeger-grill-monitor"}'
          stages:
            - json:
                expressions:
                  level: level
                  module: module
                  msg: msg
            - labels:
                level:
                module:
